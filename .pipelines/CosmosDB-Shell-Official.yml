#################################################################################
#                      OneBranch Pipelines - Official Build                     #
# This pipeline was created by EasyStart from a sample located at:              #
#   https://aka.ms/obpipelines/easystart/samples                                #
# Documentation:  https://aka.ms/obpipelines                                    #
# Yaml Schema:    https://aka.ms/obpipelines/yaml/schema                        #
# Retail Tasks:   https://aka.ms/obpipelines/tasks                              #
# Support:        https://aka.ms/onebranchsup                                   #
#################################################################################

trigger: # https://aka.ms/obpipelines/triggers
  branches:
    include:
      - "main"

parameters: # parameters are shown up in ADO UI in a build queue time
  - name: "debug"
    displayName: "Enable debug output"
    type: boolean
    default: false
  - name: "publishNuget"
    displayName: "Publish NuGet packages to internal feed"
    type: boolean
    default: true

variables:
  system.debug: ${{ parameters.debug }}

  BuildSolution: $(Build.SourcesDirectory)\CosmosDBShell.sln
  ReleaseProject: $(Build.SourcesDirectory)\CosmosDBShell\CosmosDBShell.csproj
  BuildConfiguration: Release

  WindowsContainerImage: "onebranch.azurecr.io/windows/ltsc2022/vse2022:latest" # Docker image which is used to build the project https://aka.ms/obpipelines/containers

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates # https://aka.ms/obpipelines/templates
  parameters:
    featureFlags:
      WindowsHostVersion:
        Version: 2022
        Network: R1
    cloudvault: # https://aka.ms/obpipelines/cloudvault
      enabled: false
    globalSdl: # https://aka.ms/obpipelines/sdl
      tsa:
        enabled: true # onebranch publish all sdl results to TSA. If TSA is disabled all SDL tools will forced into 'break' build mode.
      # credscan:
      #   suppressionsFile: $(Build.SourcesDirectory)\.config\CredScanSuppressions.json
      policheck:
        break: true # always break the build on policheck issues. You can disable it by setting to 'false'
      # suppression:
      #   suppressionFile: $(Build.SourcesDirectory)\.gdn\global.gdnsuppress

    stages:
      # The 1ES Official template requires the build/package jobs to run on
      # pool.type: windows (the managed OneBranch container pool); hosted
      # pools are silently dropped from Official runs.
      - stage: build
        jobs:
          - job: main
            pool:
              type: windows # 1ES Official requires pool.type; hosted vmImage jobs are stripped.

            variables: # More settings at https://aka.ms/obpipelines/yaml/jobs
              ob_outputDirectory: '$(Build.SourcesDirectory)\out' # this directory is uploaded to pipeline artifacts, reddog and cloudvault. More info at https://aka.ms/obpipelines/artifacts
              ob_artifactBaseName: cosmos_shell_all # combined artifact with all RIDs for SDL scanning
              # Nerdbank.GitVersioning needs full history to walk back to
              # the commit that last changed version.json (the baseline) so
              # it can compute the patch as the git height since that
              # commit. Setting ob_git_fetchDepth: -1 makes OneBranch do the
              # full clone in one shot instead of shallow-clone +
              # --unshallow, avoiding a second fetch to github.com that the
              # windows_build_container pool blocks.
              ob_git_fetchDepth: -1
              OneES_SbomNugetSDLPath: out\nupkg
              # https://aka.ms/obpipelines/sdl
              ob_sdl_binskim_enabled: true
              # Scan the whole checkout, not just ob_outputDirectory: the Windows exes
              # BinSkim needs are staged outside out\ (see "Stage Windows executables
              # for BinSkim" below) so the published cosmos_shell_all artifact only
              # ever contains zip/nupkg, never loose exes.
              ob_sdl_binskim_scanOutputDirectoryOnly: false
              ob_sdl_binskim_break: true # always break the build on binskim issues, even if TSA enabled. You can disable it by setting to 'false'
              ob_sdl_roslyn_break: true
              # ob_sdl_suppression_suppressionFile: $(Build.SourcesDirectory)\.gdn\job.gdnsuppress

            steps:
              - task: UseDotNet@2
                continueOnError: true
                inputs:
                  packageType: "sdk"
                  useGlobalJson: true
                  performMultiLevelLookup: true

              - script: dotnet tool restore --configfile "$(Build.SourcesDirectory)\\.pipelines\\nuget.config"
                displayName: "Dotnet Tools Restore"

              # Nerdbank.GitVersioning is wired in via PackageReference in
              # Directory.Build.props, so dotnet build/publish/pack already
              # produce versions matching version.json. We only need NBGV's
              # NuGetPackageVersion here to drive the OneBranch build
              # number and the zip filenames.
              - task: PowerShell@2
                displayName: "Compute version with nbgv"
                inputs:
                  targetType: inline
                  pwsh: true
                  script: |
                    $ErrorActionPreference = 'Stop'
                    $packageVersion = (dotnet tool run nbgv get-version -v NuGetPackageVersion).Trim()
                    if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($packageVersion)) {
                      throw "Failed to compute version metadata with nbgv."
                    }

                    Write-Host "PackageVersion:  $packageVersion"
                    Write-Host "##vso[task.setvariable variable=CosmosDBShell_PackageVersion]$packageVersion"

              - task: onebranch.pipeline.version@1
                displayName: "Update build number"
                inputs:
                  system: "Custom"
                  customVersion: "$(CosmosDBShell_PackageVersion)"

              - task: DotNetCoreCLI@2
                displayName: "DotNetCore restore"
                inputs:
                  command: "custom"
                  projects: $(BuildSolution)
                  custom: "restore"
                  arguments: "--configfile $(Build.SourcesDirectory)\\.pipelines\\nuget.config"

              - task: ComponentGovernanceComponentDetection@0
                displayName: "Component Governance - Component Detection"

              # roslynanalyzers task wraps around dotnet build to enable static analysis
              - task: RoslynAnalyzers@3
                displayName: "DotNetCore build with RoslynAnalyzers"
                inputs:
                  userProvideBuildInfo: "msBuildInfo"
                  msBuildCommandline: "dotnet.exe build $(BuildSolution) --no-restore --configuration $(BuildConfiguration)"

              - task: DotNetCoreCLI@2
                displayName: "DotNetCore test"
                inputs:
                  command: "test"
                  projects: $(BuildSolution)
                  arguments: '--no-build --no-restore --configuration $(BuildConfiguration) --logger trx --blame --collect "Code coverage" --results-directory $(Build.SourcesDirectory)\TestResults\'
                  publishTestResults: false

              - task: PublishTestResults@2
                displayName: "Publish test results"
                inputs:
                  testResultsFormat: VSTest
                  testResultsFiles: '$(Build.SourcesDirectory)\TestResults\**\*.trx'
                  failTaskOnFailedTests: true

              - task: DotNetCoreCLI@2
                displayName: "DotNetCore publish (Windows)"
                inputs:
                  command: "publish"
                  publishWebProjects: false
                  projects: $(ReleaseProject)
                  arguments: '--configuration $(BuildConfiguration) -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true --output $(Build.SourcesDirectory)\out\win-x64 --configfile $(Build.SourcesDirectory)\.pipelines\nuget.config'
                  zipAfterPublish: false

              - task: DotNetCoreCLI@2
                displayName: "DotNetCore publish (Windows ARM64)"
                inputs:
                  command: "publish"
                  publishWebProjects: false
                  projects: $(ReleaseProject)
                  arguments: '--configuration $(BuildConfiguration) -r win-arm64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true --output $(Build.SourcesDirectory)\out\win-arm64 --configfile $(Build.SourcesDirectory)\.pipelines\nuget.config'
                  zipAfterPublish: false

              - task: DotNetCoreCLI@2
                displayName: "DotNetCore publish (MacOS)"
                inputs:
                  command: "publish"
                  publishWebProjects: false
                  projects: $(ReleaseProject)
                  arguments: '--configuration $(BuildConfiguration) -r osx-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true --output $(Build.SourcesDirectory)\out\osx-x64 --configfile $(Build.SourcesDirectory)\.pipelines\nuget.config'
                  zipAfterPublish: false

              - task: DotNetCoreCLI@2
                displayName: "DotNetCore publish (Linux)"
                inputs:
                  command: "publish"
                  publishWebProjects: false
                  projects: $(ReleaseProject)
                  arguments: '--configuration $(BuildConfiguration) -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true --output $(Build.SourcesDirectory)\out\linux-x64 --configfile $(Build.SourcesDirectory)\.pipelines\nuget.config'
                  zipAfterPublish: false

              - task: DotNetCoreCLI@2
                displayName: "DotNetCore publish (Linux ARM64)"
                inputs:
                  command: "publish"
                  publishWebProjects: false
                  projects: $(ReleaseProject)
                  arguments: '--configuration $(BuildConfiguration) -r linux-arm64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true --output $(Build.SourcesDirectory)\out\linux-arm64 --configfile $(Build.SourcesDirectory)\.pipelines\nuget.config'
                  zipAfterPublish: false

              - task: DotNetCoreCLI@2
                displayName: "DotNetCore publish (MacOS ARM64)"
                inputs:
                  command: "publish"
                  publishWebProjects: false
                  projects: $(ReleaseProject)
                  arguments: '--configuration $(BuildConfiguration) -r osx-arm64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true --output $(Build.SourcesDirectory)\out\osx-arm64 --configfile $(Build.SourcesDirectory)\.pipelines\nuget.config'
                  zipAfterPublish: false

              # Kept for reference, intentionally disabled:
              # - task: DotNetCoreCLI@2
              #   displayName: "DotNetCore publish (Any)"
              #   inputs:
              #     command: "publish"
              #     publishWebProjects: false
              #     projects: $(ReleaseProject)
              #     arguments: '--configuration $(BuildConfiguration) -r any --output $(Build.SourcesDirectory)\out\any'
              #     zipAfterPublish: false

              # Framework-dependent (FDD) single-file publishes, one per RID. These
              # omit the runtime (require .NET 10 on the target) and are ~3-4x smaller
              # than the self-contained zips above. EnableCompressionInSingleFile is
              # explicitly false here because it requires a self-contained publish;
              # the csproj default (true) only applies to the self-contained builds.
              # IncludeAllContentForSelfExtract bundles native deps (msalruntime,
              # Cosmos ServiceInterop, CRT DLLs) into the single file instead of
              # leaving them as loose files alongside it. Land in out\fdd\<rid> so
              # the signing step below (which scans all of out\) covers these too.
              - task: PowerShell@2
                displayName: "DotNetCore publish framework-dependent (all RIDs)"
                condition: succeeded()
                inputs:
                  targetType: inline
                  pwsh: true
                  script: |
                    $ErrorActionPreference = 'Stop'
                    $rids = @('win-x64', 'win-arm64', 'linux-x64', 'linux-arm64', 'osx-x64', 'osx-arm64')
                    foreach ($rid in $rids) {
                      $out = "$(Build.SourcesDirectory)\out\fdd\$rid"
                      Write-Host "Publishing framework-dependent build for $rid -> $out"
                      dotnet publish "$(ReleaseProject)" `
                        --configuration "$(BuildConfiguration)" `
                        -r $rid `
                        --self-contained false `
                        -p:PublishSingleFile=true `
                        -p:EnableCompressionInSingleFile=false `
                        -p:IncludeAllContentForSelfExtract=true `
                        -p:PackAsTool=false `
                        --output $out `
                        --configfile "$(Build.SourcesDirectory)\.pipelines\nuget.config"
                      if ($LASTEXITCODE -ne 0) {
                        throw "Framework-dependent publish failed for $rid (exit $LASTEXITCODE)."
                      }
                    }

              - task: onebranch.pipeline.signing@1
                displayName: "Sign publish output"
                inputs:
                  command: "sign"
                  signing_profile: "external_distribution"
                  files_to_sign: "**/*.exe;**/*.dll"
                  search_root: '$(Build.SourcesDirectory)\out'

              - task: PowerShell@2
                displayName: "Zip and validate signed publish folders (self-contained + FDD)"
                condition: succeeded()
                inputs:
                  targetType: inline
                  pwsh: true
                  script: |
                    $ErrorActionPreference = 'Stop'
                    Add-Type -AssemblyName System.IO.Compression
                    Add-Type -AssemblyName System.IO.Compression.FileSystem

                    $version = "$(CosmosDBShell_PackageVersion)"
                    $outDir  = "$(Build.SourcesDirectory)\out"
                    $zipDir  = Join-Path $outDir 'zip'
                    New-Item -ItemType Directory -Path $zipDir -Force | Out-Null

                    $rids = @('win-x64', 'win-arm64', 'linux-x64', 'linux-arm64', 'osx-x64', 'osx-arm64')

                    # Zips a publish folder that must contain exactly one file (a
                    # single-file executable, self-contained or framework-dependent)
                    # and validates its leaf name before returning its path.
                    function New-ValidatedSingleFileZip {
                      param(
                        [string]$Label,
                        [string]$PublishDir,
                        [string]$ZipPath,
                        [string]$ExpectedExe
                      )

                      if (-not (Test-Path $PublishDir)) {
                        Write-Error "$Label publish folder not found at $PublishDir."
                        exit 1
                      }

                      if (Test-Path $ZipPath) {
                        Remove-Item -Path $ZipPath -Force
                      }

                      Write-Host "Creating $ZipPath"
                      [System.IO.Compression.ZipFile]::CreateFromDirectory(
                        $PublishDir,
                        $ZipPath,
                        [System.IO.Compression.CompressionLevel]::Optimal,
                        $false)

                      $archive = [System.IO.Compression.ZipFile]::OpenRead($ZipPath)
                      try {
                        $files = @($archive.Entries | Where-Object { -not [string]::IsNullOrEmpty([System.IO.Path]::GetFileName($_.FullName)) })
                        if ($files.Count -ne 1) {
                          $entries = ($files | ForEach-Object { $_.FullName }) -join ', '
                          Write-Error "$Label archive $ZipPath must contain exactly one executable. Found $($files.Count) files: $entries"
                          exit 1
                        }

                        # The task may nest the publish under a project-named folder,
                        # so validate the leaf name while allowing that directory.
                        $actualExe = [System.IO.Path]::GetFileName($files[0].FullName)
                        if ($actualExe -ine $ExpectedExe) {
                          Write-Error "$Label archive $ZipPath must contain only '$ExpectedExe'; found '$($files[0].FullName)'."
                          exit 1
                        }

                        Write-Host "Validated $Label archive: $($files[0].FullName) [$($files[0].Length) bytes]"
                      }
                      finally {
                        $archive.Dispose()
                      }
                    }

                    foreach ($rid in $rids) {
                      $expectedExe = if ($rid -like 'win-*') { 'CosmosDBShell.exe' } else { 'CosmosDBShell' }

                      New-ValidatedSingleFileZip `
                        -Label 'self-contained' `
                        -PublishDir (Join-Path $outDir $rid) `
                        -ZipPath (Join-Path $zipDir ("cosmosdbshell_{0}_{1}.zip" -f $rid, $version)) `
                        -ExpectedExe $expectedExe

                      New-ValidatedSingleFileZip `
                        -Label 'framework-dependent' `
                        -PublishDir (Join-Path $outDir "fdd\$rid") `
                        -ZipPath (Join-Path $zipDir ("cosmosdbshell_fdd_{0}_{1}.zip" -f $rid, $version)) `
                        -ExpectedExe $expectedExe
                    }

                    Write-Host "Generated archives:"
                    Get-ChildItem -Path $zipDir -Filter *.zip | Sort-Object Name | ForEach-Object {
                      Write-Host " - $($_.Name) [$($_.Length) bytes]"
                    }

              - task: DotNetCoreCLI@2
                displayName: "Build Fuzzer"
                inputs:
                  command: "build"
                  projects: "$(Build.SourcesDirectory)\\CosmosDBShell.Fuzzer\\CosmosDBShell.Fuzzer.csproj"
                  arguments: "--configuration $(BuildConfiguration) --no-restore"

              - task: PowerShell@2
                displayName: "Run Fuzzer Smoke Test"
                inputs:
                  targetType: inline
                  script: |
                    Write-Host "Starting fuzz smoke test..."
                    # Stable artifact directory
                    $artifactFindings = "$(Build.SourcesDirectory)\\fuzz-findings"
                    if (Test-Path $artifactFindings) {
                      Remove-Item -Recurse -Force $artifactFindings
                    }

                    Write-Host "Running fuzz harness"
                    cd "$(Build.SourcesDirectory)\\CosmosDBShell.Fuzzer"
                    dotnet run --no-build --configuration $(BuildConfiguration) -- --all

                    # Check if the fuzzer created findings in the expected location
                    $sourceFindingsDir = "$(Build.SourcesDirectory)\\CosmosDBShell.Fuzzer\\findings"

                    $hasCrashes = $false
                    $crashCount = 0

                    # Check both possible locations
                    foreach ($findingsPath in $sourceFindingsDir) {
                      if (Test-Path $findingsPath) {
                        $crashesDir = Join-Path $findingsPath "crashes"
                        if (Test-Path $crashesDir) {
                          $crashFiles = Get-ChildItem $crashesDir -File
                          if ($crashFiles.Count -gt 0) {
                            $hasCrashes = $true
                            $crashCount = $crashFiles.Count
                            Write-Host "Found $crashCount crash(es) at $crashesDir"
                            
                            # Copy findings to artifact directory for publishing
                            New-Item -ItemType Directory -Path $artifactFindings -Force | Out-Null
                            Copy-Item $findingsPath\* $artifactFindings -Recurse -Force
                            break
                          }
                        }
                      }
                    }

                    if ($hasCrashes) {
                      echo "##vso[task.logissue type=error]Fuzzer detected $crashCount crash(es)."
                      echo "##vso[task.setvariable variable=FuzzerCrashes]$crashCount"
                      echo "##vso[task.setvariable variable=HasFuzzFindings]true"
                    } else {
                      Write-Host "No crashes detected during fuzz testing."
                      echo "##vso[task.setvariable variable=HasFuzzFindings]false"
                    }

              - task: PowerShell@2
                displayName: "Fail on Fuzz Crashes"
                condition: and(succeededOrFailed(), eq(variables['HasFuzzFindings'], 'true'))
                inputs:
                  targetType: inline
                  script: |
                    if ($env:FuzzerCrashes -and [int]$env:FuzzerCrashes -gt 0) {
                      Write-Error "Failing build due to $($env:FuzzerCrashes) fuzz crash(es)."
                      exit 1
                    }

              - task: PowerShell@2
                displayName: "Clean NuGet package output"
                condition: succeeded()
                inputs:
                  targetType: inline
                  script: |
                    $pkgDir = "$(Build.SourcesDirectory)\out\nupkg"
                    New-Item -ItemType Directory -Path $pkgDir -Force | Out-Null
                    Get-ChildItem -Path $pkgDir -Filter *.nupkg -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue

              # The published NuGet packages are framework-dependent .NET global
              # tool packages, split per RID (tools/net10.0/<rid>) so each download
              # only carries that platform's native deps (~12-24 MB) instead of one
              # RID-agnostic package bundling every platform's natives (~35 MB).
              # dotnet pack emits a tiny RID-agnostic pointer package (CosmosDBShell)
              # plus one package per RID (CosmosDBShell.<rid>); `dotnet tool install`
              # resolves the right RID package by convention when both are present in
              # the same feed/local source, matching README's install instructions.
              # Self-contained builds ship only as per-RID zip archives above — never
              # as NuGet packages.
              #
              # Payload signing note: signing bin/ IL assemblies before pack is
              # ineffective — pack rebuilds the tool payload and the input signatures
              # are lost. The loose tools/net10.0/<rid>/*.dll assemblies are instead
              # Authenticode-signed post-pack via the extract/sign/repack steps below.
              - task: PowerShell@2
                displayName: "Pack CosmosDBShell (framework-dependent, per-RID) NuGet"
                condition: succeeded()
                inputs:
                  targetType: inline
                  pwsh: true
                  script: |
                    $ErrorActionPreference = 'Stop'
                    $pkgDir = "$(Build.SourcesDirectory)\out\nupkg"
                    New-Item -ItemType Directory -Path $pkgDir -Force | Out-Null
                    Get-ChildItem -Path $pkgDir -Filter *.nupkg -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue

                    $rids = @('win-x64', 'win-arm64', 'linux-x64', 'linux-arm64', 'osx-x64', 'osx-arm64')

                    # RuntimeIdentifiers/ToolPackageRuntimeIdentifiers are intentionally
                    # NOT cleared here: the csproj's default RID list is what drives
                    # dotnet pack's per-RID tool split. Only override the properties
                    # that make this pack framework-dependent (not self-contained).
                    # A .rsp keeps these explicit and stable across shells.
                    $rspPath = Join-Path "$(Agent.TempDirectory)" 'pack-fdd.rsp'
                    @(
                      "-p:SelfContained=false"
                      "-p:PublishSingleFile=false"
                      "-p:EnableCompressionInSingleFile=false"
                      "-p:PackAsTool=true"
                      "-p:ContinuousIntegrationBuild=true"
                    ) | Set-Content -Path $rspPath -Encoding ascii

                    Write-Host "Pack response file:"
                    Get-Content -Path $rspPath | ForEach-Object { Write-Host "  $_" }

                    # Prove MSBuild is packing framework-dependent with the full RID
                    # set still in play (not accidentally cleared or self-contained).
                    $evalJson = & dotnet msbuild "$(ReleaseProject)" `
                      -getProperty:SelfContained `
                      -getProperty:ToolPackageRuntimeIdentifiers `
                      -getProperty:RuntimeIdentifiers `
                      -getProperty:PackageId `
                      "@$rspPath"
                    if ($LASTEXITCODE -ne 0) {
                      throw "Failed to evaluate pack properties (exit $LASTEXITCODE)."
                    }
                    Write-Host "Evaluated pack properties: $evalJson"
                    $eval = $evalJson | ConvertFrom-Json
                    $props = $eval.Properties
                    if ($props.SelfContained -ne 'false') {
                      throw "SelfContained must be false for FDD pack; got '$($props.SelfContained)'."
                    }
                    if ($props.PackageId -ne 'CosmosDBShell') {
                      throw "PackageId must be CosmosDBShell; got '$($props.PackageId)'."
                    }
                    foreach ($rid in $rids) {
                      if ([string]$props.ToolPackageRuntimeIdentifiers -notmatch [regex]::Escape($rid)) {
                        throw "ToolPackageRuntimeIdentifiers must include '$rid' for the per-RID FDD split; got '$($props.ToolPackageRuntimeIdentifiers)'."
                      }
                      if ([string]$props.RuntimeIdentifiers -notmatch [regex]::Escape($rid)) {
                        throw "RuntimeIdentifiers must include '$rid' for the per-RID FDD split; got '$($props.RuntimeIdentifiers)'."
                      }
                    }

                    # Fresh restore/build (no --no-build/--no-restore): different
                    # configuration than the self-contained RID zip publishes.
                    & dotnet pack "$(ReleaseProject)" `
                      --configuration "$(BuildConfiguration)" `
                      --output $pkgDir `
                      --configfile "$(Build.SourcesDirectory)\.pipelines\nuget.config" `
                      "@$rspPath"
                    if ($LASTEXITCODE -ne 0) {
                      throw "dotnet pack (framework-dependent) failed with exit code $LASTEXITCODE."
                    }

                    # Expect exactly one pointer package (CosmosDBShell.<version>.nupkg,
                    # no RID suffix) plus exactly one package per RID. Anything else
                    # (missing RID, duplicate, or a stray any/FrameworkDependent name)
                    # fails the build immediately instead of silently shipping wrong.
                    $allPackages = @(Get-ChildItem -Path $pkgDir -Filter '*.nupkg' -File -ErrorAction SilentlyContinue)
                    $pointer = @($allPackages | Where-Object { $_.Name -match '^CosmosDBShell\.\d' })
                    $ridPattern = '^CosmosDBShell\.(' + ($rids -join '|') + ')\.'
                    $ridPackages = @($allPackages | Where-Object { $_.Name -match $ridPattern })
                    $unexpected = @($allPackages | Where-Object { $_.Name -notmatch '^CosmosDBShell\.\d' -and $_.Name -notmatch $ridPattern })
                    Write-Host "Packages after pack:"
                    $allPackages | Sort-Object Name | ForEach-Object { Write-Host (" - {0} [{1} bytes]" -f $_.Name, $_.Length) }
                    if ($unexpected.Count -gt 0) {
                      $names = ($unexpected | ForEach-Object { $_.Name }) -join ', '
                      throw "Pack emitted unexpected package(s). Only the pointer and per-RID packages are allowed. Found: $names"
                    }
                    if ($pointer.Count -ne 1) {
                      $names = ($pointer | ForEach-Object { $_.Name }) -join ', '
                      throw "Expected exactly one pointer CosmosDBShell.<version>.nupkg after pack. Found: $names"
                    }
                    foreach ($rid in $rids) {
                      $matches = @($ridPackages | Where-Object { $_.Name -match ('^CosmosDBShell\.' + [regex]::Escape($rid) + '\.') })
                      if ($matches.Count -ne 1) {
                        throw "Expected exactly one CosmosDBShell.$rid.<version>.nupkg after pack. Found $($matches.Count)."
                      }
                    }

              - task: PowerShell@2
                displayName: "Expand NuGet package for payload signing"
                condition: succeeded()
                inputs:
                  targetType: inline
                  pwsh: true
                  script: |
                    $ErrorActionPreference = 'Stop'
                    $pkgDir = "$(Build.SourcesDirectory)\out\nupkg"
                    $signStage = "$(Build.SourcesDirectory)\out\nupkg-payload"

                    if (Test-Path $signStage) {
                      Remove-Item -Recurse -Force $signStage
                    }

                    New-Item -ItemType Directory -Path $signStage -Force | Out-Null

                    # Expand every framework-dependent package (the pointer plus all
                    # per-RID packages) so each RID package's loose tools/*.dll are
                    # Authenticode-signed. The pointer has no binaries but is expanded
                    # too for a uniform extract/sign/repack pass.
                    $packages = @(Get-ChildItem -Path $pkgDir -Filter "CosmosDBShell.*.nupkg" -File -ErrorAction SilentlyContinue)

                    if ($packages.Count -eq 0) {
                      Write-Error "No CosmosDBShell packages found to expand for payload signing."
                      exit 1
                    }

                    foreach ($pkg in $packages) {
                      $targetDir = Join-Path $signStage $pkg.BaseName
                      [System.IO.Compression.ZipFile]::ExtractToDirectory($pkg.FullName, $targetDir)
                    }

              - task: onebranch.pipeline.signing@1
                displayName: "Sign NuGet payload binaries"
                condition: succeeded()
                inputs:
                  command: "sign"
                  signing_profile: "external_distribution"
                  files_to_sign: "**/*.exe;**/*.dll"
                  search_root: '$(Build.SourcesDirectory)\out\nupkg-payload'

              - task: PowerShell@2
                displayName: "Repack NuGet package with signed payload"
                condition: succeeded()
                inputs:
                  targetType: inline
                  pwsh: true
                  script: |
                    $pkgDir = "$(Build.SourcesDirectory)\out\nupkg"
                    $signStage = "$(Build.SourcesDirectory)\out\nupkg-payload"

                    $stagedPackages = Get-ChildItem -Path $signStage -Directory -ErrorAction SilentlyContinue
                    if (-not $stagedPackages -or $stagedPackages.Count -eq 0) {
                      Write-Error "No expanded packages found to repack."
                      exit 1
                    }

                    foreach ($staged in $stagedPackages) {
                      $packagePath = Join-Path $pkgDir ($staged.Name + ".nupkg")

                      if (-not (Test-Path $packagePath)) {
                        Write-Error "Expected package not found for repack: $packagePath"
                        exit 1
                      }

                      Remove-Item -Path $packagePath -Force
                      [System.IO.Compression.ZipFile]::CreateFromDirectory($staged.FullName, $packagePath, [System.IO.Compression.CompressionLevel]::Optimal, $false)
                    }

              - task: PowerShell@2
                displayName: "Validate NuGet package set"
                condition: succeeded()
                inputs:
                  targetType: inline
                  pwsh: true
                  script: |
                    $ErrorActionPreference = 'Stop'
                    $pkgDir = "$(Build.SourcesDirectory)\out\nupkg"
                    $rids = @('win-x64', 'win-arm64', 'linux-x64', 'linux-arm64', 'osx-x64', 'osx-arm64')

                    $allPackages = @(Get-ChildItem -Path $pkgDir -Filter '*.nupkg' -File -ErrorAction SilentlyContinue)
                    $pointer = @($allPackages | Where-Object { $_.Name -match '^CosmosDBShell\.\d' })
                    $ridPattern = '^CosmosDBShell\.(' + ($rids -join '|') + ')\.'
                    $ridPackages = @($allPackages | Where-Object { $_.Name -match $ridPattern })
                    $unexpected = @($allPackages | Where-Object { $_.Name -notmatch '^CosmosDBShell\.\d' -and $_.Name -notmatch $ridPattern })

                    Write-Host "NuGet packages for validation:"
                    $allPackages | Sort-Object Name | ForEach-Object {
                      Write-Host (" - {0} [{1} bytes]" -f $_.Name, $_.Length)
                    }

                    # Expect one RID-agnostic pointer (CosmosDBShell.<version>.nupkg)
                    # plus one framework-dependent package per RID. Self-contained
                    # builds ship only as zips and must never appear here.
                    if ($unexpected.Count -gt 0) {
                      $names = ($unexpected | ForEach-Object { $_.Name }) -join ', '
                      Write-Error "Unexpected package(s) in out\nupkg. Only the pointer and per-RID FDD packages are allowed. Found: $names"
                      exit 1
                    }
                    if ($pointer.Count -ne 1) {
                      $names = ($pointer | ForEach-Object { $_.Name }) -join ', '
                      Write-Error "Expected exactly one pointer CosmosDBShell.<version>.nupkg. Found: $names"
                      exit 1
                    }
                    foreach ($rid in $rids) {
                      $matches = @($ridPackages | Where-Object { $_.Name -match ('^CosmosDBShell\.' + [regex]::Escape($rid) + '\.') })
                      if ($matches.Count -ne 1) {
                        Write-Error "Expected exactly one CosmosDBShell.$rid.<version>.nupkg. Found $($matches.Count)."
                        exit 1
                      }
                    }

                    # Spot-check payload shape: the pointer carries only the tiny
                    # tools/net10.0/any manifest (no natives); each RID package carries
                    # its own tools/net10.0/<rid> content and no other RID's natives.
                    Add-Type -AssemblyName System.IO.Compression.FileSystem

                    $pointerArchive = [System.IO.Compression.ZipFile]::OpenRead($pointer[0].FullName)
                    try {
                      $pointerNames = @($pointerArchive.Entries | ForEach-Object { $_.FullName -replace '\\', '/' })
                      $pointerRidTools = $pointerNames | Where-Object { $_ -match ('^tools/net10\.0/(' + ($rids -join '|') + ')/') }
                      if ($pointerRidTools) {
                        Write-Error "Pointer package $($pointer[0].Name) must not contain RID-specific tools/ paths."
                        exit 1
                      }
                    }
                    finally {
                      $pointerArchive.Dispose()
                    }

                    foreach ($rid in $rids) {
                      $pkg = $ridPackages | Where-Object { $_.Name -match ('^CosmosDBShell\.' + [regex]::Escape($rid) + '\.') } | Select-Object -First 1
                      $archive = [System.IO.Compression.ZipFile]::OpenRead($pkg.FullName)
                      try {
                        $names = @($archive.Entries | ForEach-Object { $_.FullName -replace '\\', '/' })
                        $hasOwnTools = $names | Where-Object { $_ -like "tools/net10.0/$rid/*" }
                        if (-not $hasOwnTools) {
                          Write-Error "Package $($pkg.Name) is missing tools/net10.0/$rid/* (not a framework-dependent tool package for $rid)."
                          exit 1
                        }
                        $otherRids = $rids | Where-Object { $_ -ne $rid }
                        $crossRidTools = $names | Where-Object {
                          $_ -match ('^tools/net10\.0/(' + ($otherRids -join '|') + ')/')
                        }
                        if ($crossRidTools) {
                          Write-Error "Package $($pkg.Name) contains other RIDs' tools/ paths; each per-RID package must only carry its own platform."
                          exit 1
                        }
                      }
                      finally {
                        $archive.Dispose()
                      }
                    }

              - task: onebranch.pipeline.signing@1
                displayName: "Sign NuGet packages"
                condition: succeeded()
                inputs:
                  command: "sign"
                  cp_code: "CP-401405"
                  files_to_sign: "**/*.nupkg"
                  search_root: '$(Build.SourcesDirectory)\out\nupkg'

              # Clean unsigned build intermediates so Guardian CodeSignValidation
              # (which scans the entire source tree) only sees signed binaries in out\.
              # Also trim out\ to the directories we actually want in the published
              # cosmos_shell_all artifact: out\zip (per-RID executable archives) and
              # out\nupkg (NuGet packages). The 1ES template appends out\_manifest
              # (SBOM + signed build.manifest) on its own afterwards.
              # This MUST run before the NuGet push, because the 1ES Pipeline Template
              # injects a full-tree CodeSign scan after the last user step group.
              #
              # The Windows exes (self-contained and framework-dependent) are staged to
              # a location outside out\ first (below) so BinSkim (scanning the whole
              # checkout, see ob_sdl_binskim_scanOutputDirectoryOnly above) still has
              # loose PE files to scan, without those exes ending up duplicated in the
              # artifact alongside the already-zipped copies in out\zip.
              - task: PowerShell@2
                displayName: "Stage Windows executables for BinSkim (outside published artifact)"
                condition: always()
                inputs:
                  targetType: inline
                  script: |
                    $outDir = "$(Build.SourcesDirectory)\out"
                    $scanDir = "$(Build.SourcesDirectory)\_binskim-scan"
                    $sources = @{
                      'sc-win-x64'    = Join-Path $outDir 'win-x64'
                      'sc-win-arm64'  = Join-Path $outDir 'win-arm64'
                      'fdd-win-x64'   = Join-Path $outDir 'fdd\win-x64'
                      'fdd-win-arm64' = Join-Path $outDir 'fdd\win-arm64'
                    }
                    foreach ($entry in $sources.GetEnumerator()) {
                      if (Test-Path $entry.Value) {
                        $target = Join-Path $scanDir $entry.Key
                        New-Item -ItemType Directory -Path $target -Force | Out-Null
                        Copy-Item -Path (Join-Path $entry.Value '*') -Destination $target -Recurse -Force
                      }
                    }

              - task: PowerShell@2
                displayName: "Clean non-shipping build outputs before SDL"
                condition: always()
                inputs:
                  targetType: inline
                  script: |
                    $dirs = @(
                      "$(Build.SourcesDirectory)\CosmosDBShell\bin",
                      "$(Build.SourcesDirectory)\CosmosDBShell\obj",
                      "$(Build.SourcesDirectory)\CosmosDBShell.Tests\bin",
                      "$(Build.SourcesDirectory)\CosmosDBShell.Tests\obj",
                      "$(Build.SourcesDirectory)\CosmosDBShell.Fuzzer\bin",
                      "$(Build.SourcesDirectory)\CosmosDBShell.Fuzzer\obj",
                      "$(Build.SourcesDirectory)\CosmosDBShell.Analyzer\bin",
                      "$(Build.SourcesDirectory)\CosmosDBShell.Analyzer\obj",
                      "$(Build.SourcesDirectory)\TestResults"
                    )
                    foreach ($d in $dirs) {
                      if (Test-Path $d) {
                        Write-Host "Removing $d"
                        Remove-Item -Recurse -Force $d
                      }
                    }
                    Write-Host "Non-shipping build outputs cleaned."

                    $outDir = "$(Build.SourcesDirectory)\out"
                    if (Test-Path $outDir) {
                      # Whitelist approach: keep only the dirs we explicitly want shipped
                      # in the cosmos_shell_all artifact. Anything else (per-RID publish
                      # folders, nupkg-payload sign-staging, future intermediates) is noise.
                      # win-x64/win-arm64 are intentionally NOT kept — those exes are
                      # already zipped into out\zip and were staged to _binskim-scan\
                      # above for scanning, so keeping a third loose copy here would
                      # just duplicate them in the published artifact.
                      $keep = @('zip', 'nupkg', '_manifest')
                      Get-ChildItem -Path $outDir -Directory -Force -ErrorAction SilentlyContinue | Where-Object { $keep -notcontains $_.Name } | ForEach-Object {
                        Write-Host "Trimming $($_.FullName) from out\"
                        Remove-Item -Recurse -Force $_.FullName
                      }
                      Get-ChildItem -Path $outDir -File -Force -ErrorAction SilentlyContinue | ForEach-Object {
                        Write-Host "Trimming loose file $($_.FullName) from out\"
                        Remove-Item -Force $_.FullName
                      }
                    }

              # List the packed NuGet package(s) in out\nupkg so the published
              # artifact set is visible in the build log before the push.
              - task: PowerShell@2
                displayName: "List NuGet packages before publish"
                condition: succeeded()
                inputs:
                  targetType: inline
                  script: |
                    $pkgDir = "$(Build.SourcesDirectory)\out\nupkg"
                    Write-Host "NuGet packages in $pkgDir"
                    Get-ChildItem -Path $pkgDir -Filter *.nupkg -File | Sort-Object Name | ForEach-Object {
                      Write-Host " - $($_.Name) [$($_.Length) bytes]"
                    }

              - ${{ if and(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(parameters.publishNuget, true)) }}:
                  - task: NuGetCommand@2
                    displayName: "Push CosmosDBShell NuGet packages"
                    inputs:
                      command: "push"
                      # Pointer package plus all per-RID framework-dependent packages.
                      # Excludes any stray any-RID/FrameworkDependent variant name that
                      # should never be produced by the pack step above.
                      packagesToPush: '$(Build.SourcesDirectory)\out\nupkg\CosmosDBShell.*.nupkg;!$(Build.SourcesDirectory)\out\nupkg\CosmosDBShell.any.*.nupkg;!$(Build.SourcesDirectory)\out\nupkg\CosmosDBShell.FrameworkDependent.*.nupkg'
                      nuGetFeedType: "internal"
                      publishVstsFeed: "CosmosDB/CosmosDBShell"
                      allowPackageConflicts: true

          - job: CodeQLAnalyze
            displayName: CodeQL (C#)
            pool:
              vmImage: ubuntu-latest
            steps:
              - checkout: self
                persistCredentials: true
              - task: CodeQL3000Init@0
                inputs:
                  languages: "csharp"
              - script: |
                  dotnet restore CosmosDBShell.sln --configfile .pipelines/nuget.config
                  dotnet build CosmosDBShell.sln -c Release --no-incremental
                displayName: Build for CodeQL
              - task: CodeQL3000Finalize@0
                displayName: Finalize CodeQL
