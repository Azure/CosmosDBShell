name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cli-contracts:
    name: Portable CLI Contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/cli-contracts/requirements*.txt

      - name: Build C# reference
        shell: pwsh
        run: |
          Copy-Item tests/cli-contracts/fixtures/locale.de-DE.ftl CosmosDBShell/lang/de-DE.ftl
          dotnet build CosmosDBShell/CosmosDBShell.csproj

      - name: Install contract runner
        run: python -m pip install -r tests/cli-contracts/requirements.txt

      - name: Validate migration inventory
        run: python tests/cli-contracts/inventory.py --output artifacts/cli-contract-inventory.json

      - name: Run runner self-tests and offline contracts
        shell: pwsh
        env:
          COSMOSDB_SHELL_UI_LANGUAGE: de-DE
        run: |
          $assembly = & ./tests/cli-contracts/resolve-shell-assembly.ps1
          $localizedHelp = dotnet $assembly --help
          if ($LASTEXITCODE -ne 0 -or ($localizedHelp -join "`n") -notmatch 'Testkatalog: Ausgabeformat') {
            throw 'The reference did not load the non-English fixture catalog.'
          }
          python -m pytest tests/cli-contracts --profile offline `
            --shell-executable dotnet --shell-prefix-arg $assembly `
            --contract-artifacts artifacts/cli-contract-failures `
            --junitxml artifacts/cli-contracts.xml -q

      - name: Upload contract report and synthetic failure data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-contracts-${{ matrix.os }}
          path: |
            artifacts/cli-contract-inventory.json
            artifacts/cli-contracts.xml
            artifacts/cli-contract-failures/
          retention-days: 7

  offline-tests:
    name: Offline Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore CosmosDBShell.Tests/CosmosDBShell.Tests.csproj

      - name: Build
        run: dotnet build CosmosDBShell.Tests/CosmosDBShell.Tests.csproj --no-restore

      - name: Run offline tests
        run: dotnet test CosmosDBShell.Tests/ --filter "Category!=Emulator" --no-build --no-restore

  emulator-tests:
    name: Emulator Integration Tests
    runs-on: ubuntu-latest
    services:
      cosmosdb:
        # Pin the passing preview image to avoid regressions from the rolling tag.
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator@sha256:db53613dae19d0a3d5ad50688d14aa6e957af082dafea56b52e1bd3a6b3f1406
        # Prevent startup updates from replacing modules under running PostgreSQL.
        # Remove when Azure/azure-cosmos-db-emulator-docker#390 is fixed in this image.
        options: --add-host packages.microsoft.com:127.0.0.1
        ports:
          - 8081:8081
        env:
          PROTOCOL: https

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Packages.props
            **/*.csproj

      - name: Wait for Cosmos DB Emulator
        run: |
          echo "Waiting for Cosmos DB Emulator to start..."
          for i in $(seq 1 90); do
            if curl -ks https://localhost:8081/ > /dev/null 2>&1; then
              echo "Emulator is ready."
              exit 0
            fi
            echo "Attempt $i: Emulator not ready yet..."
            sleep 1
          done
          echo "Emulator did not start in time."
          exit 1

      - name: Trust Cosmos DB Emulator Certificate
        run: |
          curl -k https://localhost:8081/_explorer/emulator.pem > ~/emulatorcert.crt
          sudo cp ~/emulatorcert.crt /usr/local/share/ca-certificates/
          sudo update-ca-certificates

      - name: Restore
        run: dotnet restore CosmosDBShell.Tests/CosmosDBShell.Tests.csproj

      - name: Build
        run: dotnet build CosmosDBShell.Tests/CosmosDBShell.Tests.csproj --no-restore

      - name: Run emulator tests
        # CI should fail if the emulator service is not actually reachable. The
        # MSBuild flag compiles emulator tests in "required" mode; local runs
        # without it still skip emulator tests when no emulator is running.
        # The preview emulator rejects same-ID fixtures across partition-key types.
        # The Windows emulator job below exercises those collisions.
        run: dotnet test CosmosDBShell.Tests/CosmosDBShell.Tests.csproj --filter "Category=Emulator&Feature!=PartitionKeyCollisions" --no-restore -p:CosmosRequireEmulator=true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install independent emulator fixtures
        run: python -m pip install -r tests/cli-contracts/requirements-emulator.txt

      - name: Run portable Linux emulator contracts
        shell: pwsh
        run: >-
          python -m pytest tests/cli-contracts/test_contracts.py --profile emulator-linux
          --shell-executable dotnet
          --shell-prefix-arg (& ./tests/cli-contracts/resolve-shell-assembly.ps1)
          --contract-artifacts artifacts/cli-contract-failures
          --junitxml artifacts/cli-contracts-linux-emulator.xml -q

      - name: Upload emulator contract report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-contracts-linux-emulator
          path: |
            artifacts/cli-contracts-linux-emulator.xml
            artifacts/cli-contract-failures/
          retention-days: 7

  windows-partition-key-tests:
    name: Windows Partition-Key Integration Tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Packages.props
            **/*.csproj

      - name: Install and start Windows Cosmos DB Emulator
        run: |
          $emulator = Join-Path $env:ProgramFiles 'Azure Cosmos DB Emulator\CosmosDB.Emulator.exe'
          if (-not (Test-Path $emulator)) {
            $installer = Join-Path $env:RUNNER_TEMP 'cosmosdb-emulator.msi'
            Invoke-WebRequest 'https://aka.ms/cosmosdb-emulator' -OutFile $installer
            $install = Start-Process msiexec.exe -ArgumentList @('/i', "`"$installer`"", '/quiet', '/norestart') -Wait -PassThru
            if ($install.ExitCode -notin @(0, 3010)) {
              throw "Emulator installation failed with exit code $($install.ExitCode)."
            }
          }
          $data = Join-Path $env:RUNNER_TEMP 'cosmosdb-emulator-data'
          Start-Process $emulator -ArgumentList @('/NoUI', '/NoExplorer', "/DataPath=`"$data`"")
          $deadline = (Get-Date).AddMinutes(5)
          do {
            $status = curl.exe -ks --connect-timeout 2 --max-time 5 -o NUL -w '%{http_code}' https://localhost:8081/
            if ($LASTEXITCODE -eq 0 -and $status -in @('200', '401')) {
              exit 0
            }
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)
          throw 'Windows Cosmos DB Emulator did not become ready within five minutes.'

      - name: Restore
        run: dotnet restore .\CosmosDBShell.Tests\CosmosDBShell.Tests.csproj

      - name: Run partition-key integration tests
        run: dotnet test .\CosmosDBShell.Tests\CosmosDBShell.Tests.csproj --filter "Category=Emulator&FullyQualifiedName~PrintPartitionKeyTests" --no-restore -p:CosmosRequireEmulator=true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install independent emulator fixtures
        run: python -m pip install -r tests\cli-contracts\requirements-emulator.txt

      - name: Run portable Windows emulator contracts
        run: >-
          python -m pytest tests\cli-contracts\test_contracts.py --profile emulator-windows
          --shell-executable dotnet
          --shell-prefix-arg (& ./tests/cli-contracts/resolve-shell-assembly.ps1)
          --contract-artifacts artifacts\cli-contract-failures
          --junitxml artifacts\cli-contracts-windows-emulator.xml -q

      - name: Upload emulator contract report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-contracts-windows-emulator
          path: |
            artifacts/cli-contracts-windows-emulator.xml
            artifacts/cli-contract-failures/
          retention-days: 7
