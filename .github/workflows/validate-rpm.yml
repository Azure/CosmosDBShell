name: Validate Lightweight RPM

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpm:
    name: RPM (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install RPM tooling
        run: sudo apt-get update -qq && sudo apt-get install -y rpm cpio
      - name: Test broker-disabled build capability
        run: >-
          dotnet test CosmosDBShell.Tests/CosmosDBShell.Tests.csproj
          --configuration Release
          -p:CosmosDBShellExcludeMsalRuntime=true
          --filter FullyQualifiedName~VSCodeCredential_SupportMatchesBuildCapability
      - name: Build, inspect, and smoke-test native RPM
        run: bash packaging/rpm/build.sh "${{ matrix.rid }}" 0.0.0 1
